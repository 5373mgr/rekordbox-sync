# Copy this file to config.yaml and fill in values for this machine.
# config.yaml is gitignored — never commit real host/path info.

local:
  # Root folder containing your music library on this machine.
  music_root: "D:/DJ Itunes"
  # Rekordbox data directory. Leave null to use the OS default:
  #   Windows: %APPDATA%/Pioneer/rekordbox
  #   macOS:   ~/Library/Pioneer/rekordbox
  rekordbox_data_dir: null

remote:
  # Address of the other machine, reachable over LAN or a VPN you manage
  # (e.g. Tailscale). This tool does not set up the network path itself.
  # Used only for the confirmation handshake (readiness + manifest exchange),
  # never for the actual file transfer.
  host: "100.x.x.x"
  port: 51820

  # Root folder containing the music library, as seen from the *other*
  # machine's own OS. Used to rewrite absolute track paths inside master.db
  # when syncing across machines with different path layouts
  # (e.g. Windows <-> macOS). Requires both machines' music folders to have
  # been relocated under a common relative structure during initial setup.
  music_root: "/Users/foo/Music/DJ"

  # How *this* machine reaches the other machine's folders on the
  # filesystem (a share you have already mounted, e.g. via SMB over the
  # same network/VPN used above). This is where actual file bytes go.
  music_share: "//100.x.x.x/DJ Itunes"
  rekordbox_share: "//100.x.x.x/rekordbox-data"
