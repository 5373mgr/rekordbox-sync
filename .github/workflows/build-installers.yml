name: Build installers

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: rekordbox-sync-windows
            binary_name: rekordbox-sync.exe
          - os: macos-latest
            asset_name: rekordbox-sync-macos
            binary_name: rekordbox-sync
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build executable
        run: pyinstaller --onefile --name rekordbox-sync run.py

      - name: Package artifact
        shell: bash
        run: |
          mkdir -p dist_package
          cp "dist/${{ matrix.binary_name }}" dist_package/
          cp config.example.yaml dist_package/
          cp README.md dist_package/
          python -c "import shutil; shutil.make_archive('${{ matrix.asset_name }}', 'zip', 'dist_package')"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
