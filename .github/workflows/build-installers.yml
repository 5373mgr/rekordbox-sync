name: Build installers

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build CLI executable
        run: pyinstaller --onefile --name rekordbox-sync run.py

      - name: Build GUI executable
        run: pyinstaller --onefile --windowed --name rekordbox-sync-gui run_gui.py

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installer (Inno Setup)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/windows/setup.iss
          options: /DMyAppVersion=${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-sync-windows-setup
          path: dist_installer/rekordbox-sync-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Build CLI executable
        run: pyinstaller --onefile --name rekordbox-sync run.py

      - name: Build GUI executable (.app bundle)
        run: pyinstaller --onefile --windowed --name rekordbox-sync-gui run_gui.py

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build .pkg installer
        run: installer/macos/build_pkg.sh ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: rekordbox-sync-macos-pkg
          path: dist_installer/rekordbox-sync.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/rekordbox-sync-windows-setup/rekordbox-sync-setup.exe
            artifacts/rekordbox-sync-macos-pkg/rekordbox-sync.pkg
